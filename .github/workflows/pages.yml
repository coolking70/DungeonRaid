name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Pillow (build-time lossless WebP atlases)
        run: python3 -m pip install --user pillow
      - name: Generate UI runtime data
        # ui/generated/ is gitignored; typecheck and tests import it before the build regenerates it.
        run: node --input-type=module -e "import('./tools/build-ui-runtime.mjs').then(m => m.buildUiRuntime())"
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Rule engine tests
        # Data checks (tools/check-*.mjs) need the gitignored reverse/ material and run locally only.
        run: npx vitest run
      - name: Build
        run: npx vite build --mode pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
